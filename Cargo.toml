[package]
name = "webos-cast-receiver"
version = "0.2.0"
edition = "2021"
description = "DLNA MediaRenderer that relays casts (Douyin TV button etc.) to an LG webOS TV app — Rust port"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tower = "0.5"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false }
bytes = "1"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rand = "0.9"
httpdate = "1"
if-addrs = "0.14"
url = "2"

[dev-dependencies]
socket2 = "0.6"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Keep unwinding: a panic inside one request task must not take down SSDP,
# GENA and the other connections (tokio isolates panics per task).
panic = "unwind"
