# Build the static binary and the scratch image on GitHub, push to ghcr.io.
# The Portainer stack only pulls: no Rust toolchain needed on the LAN box.
#
#   push to main      -> ghcr.io/coomteng/webos-cast-receiver-rs:latest, :sha-<short>  (linux/amd64 + linux/arm64)
#   tag v*            -> additionally :<version> and a GitHub Release with the raw binary
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # One native runner per architecture: no QEMU, no cross toolchain.
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY (added 2026-11-11) -- REMOVE once the hosted runners resolve
      # the Ubuntu archive hosts again.
      # Since ~13:48 UTC on 2026-11-11 the runners' default resolver (Azure,
      # 168.63.129.16) times out on every Canonical name (archive / security /
      # ports.ubuntu.com), so the apt step below fails with "Temporary failure
      # resolving". Upstream: actions/runner-images#15296 and #15297.
      # To revert: delete this step; nothing else depends on it.
      - name: TEMPORARY DNS override for apt (see comment, remove later)
        run: |
          IF=$(ip -o route get 1.1.1.1 | sed -E 's/.* dev ([^ ]+).*/\1/')
          sudo resolvectl dns "$IF" 1.1.1.1 1.0.0.1
          sudo resolvectl flush-caches

      - name: musl C toolchain (ring has a little C)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Rust (musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.arch }}

      - name: Test
        run: cargo test --locked

      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p out/${{ matrix.arch }} && cp target/${{ matrix.target }}/release/webos-cast-receiver out/${{ matrix.arch }}/
          ls -la out/${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/webos-cast-receiver
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: out
      # download-artifact puts each artifact in out/bin-<arch>/; Dockerfile.ci expects out/<arch>/
      - run: |
          for a in amd64 arm64; do mkdir -p out/$a && mv out/bin-$a/webos-cast-receiver out/$a/ && chmod +x out/$a/webos-cast-receiver; done
          ls -laR out

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # The build record artifact carries the push event payload too.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance attestation: it embeds the full push event payload
          # (including the pusher's e-mail address) into the public image.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/amd64/webos-cast-receiver
            out/arm64/webos-cast-receiver
          generate_release_notes: true
