# Build the static binary and the scratch image on GitHub, push to ghcr.io.
# The Portainer stack only pulls: no Rust toolchain needed on the LAN box.
#
#   push to main      -> ghcr.io/coomteng/webos-cast-receiver-rs:latest, :sha-<short>
#   tag v*            -> additionally :<version> and a GitHub Release with the raw binary
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust (musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Test
        run: cargo test --locked

      - name: Build static binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p out && cp target/x86_64-unknown-linux-musl/release/webos-cast-receiver out/
          ls -la out/

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/webos-cast-receiver
          generate_release_notes: true
